name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # setup-node's yarn cache calls yarn, which has to be the packageManager
      # version by then. The runner ships Yarn 1.
      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn install --immutable

      - run: yarn lint

      # codegen, then tsc --noEmit. Neither needs MongoDB.
      - run: yarn build

      # The federated package the Ki.CL host loads at runtime.
      - run: yarn workspace @ki-cl/client run build
