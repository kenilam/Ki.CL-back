type Query {
  """
  The signed-in user's request that is still waiting or confirmed, so a reloaded page can pick it up.
  """
  passwordChange: PasswordChange
  """
  Whether the emailed link can still be confirmed. Any session may ask: the secret is the proof.
  """
  passwordChangeLink(passwordChangeLink: PasswordChangeConfirmInput!): Boolean!
}

type Mutation {
  """
  Checks the current password, keeps the new one hashed, and emails the signed-in user a link to confirm the change.
  """
  passwordChangeRequest(passwordChangeRequest: PasswordChangeRequestInput!): PasswordChange!
  """
  Called from the emailed link. Any session may call it: the secret is the proof.
  """
  passwordChangeConfirm(passwordChangeConfirm: PasswordChangeConfirmInput!): Boolean
  """
  Sets the password kept with the request, once it has been confirmed.
  """
  passwordChangeComplete(passwordChangeComplete: PasswordChangeCompleteInput!): Boolean
}

type Subscription {
  """
  The request's status now and on every change, until it is confirmed or expires.
  """
  passwordChangeUpdated(id: ID!): PasswordChange!
}

type PasswordChange {
  id: ID!
  status: PasswordChangeStatus!
  expiresAt: DateTime!
}

enum PasswordChangeStatus {
  PENDING
  CONFIRMED
  EXPIRED
}

input PasswordChangeRequestInput {
  currentPassword: String!
  password: String!
}

input PasswordChangeConfirmInput {
  id: ID!
  secret: String!
}

input PasswordChangeCompleteInput {
  id: ID!
}
