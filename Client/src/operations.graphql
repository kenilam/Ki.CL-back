query kicl_asset($id: ID!) {
  asset(id: $id) {
    id
    url
    generator
  }
}

query kicl_imageAgentThread($id: ID!) {
  imageAgentThread(id: $id) {
    id
    status
    brief
    style
    activity
    messages {
      id
      role
      kind
      text
      assetId
      asset {
        id
        url
        generator
      }
      score {
        relevance
        quality
        styleMatch
        composition
        overall
        pass
        suggestions
      }
      rejection
      exhaustion
      choices
      at
    }
    createdAt
    updatedAt
  }
}

