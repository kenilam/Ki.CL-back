query kicl_kineticLightReadings {
  kineticLightReadings {
    id
    source
    status
    stage
    bars
    notes
    failure
    musicxml
    midi
    title
    tempo
    beatsPerBar
    chords {
      bar
      beat
      symbol
    }
    arrangement {
      voice
      beat
      zoom
