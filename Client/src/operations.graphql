query kicl_kineticLightReading($id: ID!) {
  kineticLightReading(id: $id) {
    id
    source
    status
    stage
    bars
    notes
    failure
    musicxml
    midi
    title
    tempo
    beatsPerBar
    chords {
      bar
      beat
      symbol
    }
    arrangement {
      voice
      beat
      zoom
      hue
      glow
      steps
      sections {
        from
        to
        pattern {
          kick
          snare
          hat
          openHat
          ride
          lowTom
          highTom
        }
        fill {
          kick
          snare
          hat
          openHat
          ride
          lowTom
          highTom
        }
        crash
      }
    }
    mine
    createdAt
    updatedAt
  }
}

query kicl_me {
  me {
    userGUID
    email
    firstName
    lastName
    avatar
    active
    aud
    portfolios {
      portfolioGUID
      path
    }
  }
}

query kicl_notifications {
  notifications {
    id
    collection
    documentId
    title {
      key
      values
    }
    message {
      key
      values
    }
    dismissedAt
    createdAt
    updatedAt
  }
}

query kicl_passwordChange {
  passwordChange {
    id
    status
    expiresAt
  }
}

query kicl_passwordChangeLink($passwordChangeLink: PasswordChangeConfirmInput!) {
  passwordChangeLink(passwordChangeLink: $passwordChangeLink)
}

query kicl_taxonSearch($query: String!, $limit: Int = 10) {
  taxonSearch(query: $query, limit: $limit) {
    nodeId
    ottId
    name
    rank
    source
  }
}

query kicl_taxonVisual($ottId: Int!, $name: String!, $rank: String) {
  taxonVisual(ottId: $ottId, name: $name, rank: $rank) {
    status
    ottId
    nodeId
    assetId
    description
    visualScore {
      overall
      taxonMatch
      pass
    }
    exhaustion
  }
}

query kicl_translations($namespaces: [String!]!) {
  translations(namespaces: $namespaces) {
    namespace
    field
    value
  }
}

